<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>広告の試験表示</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,sans-serif}body{display:flex;align-items:center;padding:12px 18px;background:#f3f6f3;color:#253e33;border:1px solid #dfe7df;gap:14px}.mark{flex-shrink:0;width:32px;height:32px;border-radius:9px;background:#315b43;color:white;display:grid;place-items:center;font:600 20px Georgia}small{display:block;font-size:10px;color:#596f60;margin-bottom:4px}strong{font-size:clamp(12px,3.8vw,18px);font-weight:600}.compact{display:none}body>div:last-child{min-width:0}p{font-size:11px;margin:5px 0 0;color:#596f60}@media(max-height:110px){p{display:none}body{padding:8px 14px}}@media(max-height:60px){body{padding:4px 8px;gap:6px}.mark{width:20px;height:20px;border-radius:5px;font-size:13px}small{font-size:8px;line-height:10px;margin-bottom:2px}strong{display:block;font-size:10px;line-height:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}
@media(max-height:35px){body{padding:2px 6px}.mark,strong{display:none}small{display:inline;font-size:8px;line-height:12px;margin:0 6px 0 0}.compact{display:inline;font-size:8px;line-height:12px}body>div:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}
</style>
<div class="mark" aria-hidden="true">K</div><div><small>広告 · 試験表示</small><span class="compact">計測なし</span><strong>あなたのプロダクトに、次の出会いを。</strong><p>Komorebi（仮称）のサンプルです。計測・収益は発生しません。</p></div>
</html>
